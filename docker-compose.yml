version: '3.8'

services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=sqlite:///lost_found.db
      - SECRET_KEY=your-production-secret-key-change-in-production
      - FLASK_APP=run.py
      - FLASK_ENV=production
    volumes:
      - ./instance:/app/instance
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - web
    restart: unless-stopped