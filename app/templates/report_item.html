{% extends "base.html" %}

{% block title %}Report Item - Lost & Found{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header bg-info text-white">
                <h4 class="mb-0"><i class="fas fa-plus"></i> Report Lost or Found Item</h4>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('items.report_item') }}">
                    <div class="mb-3">
                        <label for="title" class="form-label">Item Title</label>
                        <input type="text" class="form-control" id="title" name="title" placeholder="e.g., Black iPhone 13, Blue Backpack" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="description" class="form-label">Description</label>
                        <textarea class="form-control" id="description" name="description" rows="4" placeholder="Describe the item in detail..." required></textarea>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="category" class="form-label">Category</label>
                                <select class="form-select" id="category" name="category" required>
                                    <option value="">Select Category</option>
                                    <option value="Electronics">Electronics</option>
                                    <option value="Documents">Documents</option>
                                    <option value="Jewelry">Jewelry</option>
                                    <option value="Clothing">Clothing</option>
                                    <option value="Bags">Bags</option>
                                    <option value="Keys">Keys</option>
                                    <option value="Pets">Pets</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="type" class="form-label">Item Type</label>
                                <select class="form-select" id="type" name="type" required>
                                    <option value="">Select Type</option>
                                    <option value="lost">Lost Item</option>
                                    <option value="found">Found Item</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="location" class="form-label">Location</label>
                        <input type="text" class="form-control" id="location" name="location" placeholder="Where was it lost/found?" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="date" class="form-label">Date Lost/Found</label>
                        <input type="date" class="form-control" id="date" name="date" required>
                    </div>
                    
                    <button type="submit" class="btn btn-info w-100">Report Item</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
