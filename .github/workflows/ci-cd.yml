name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run tests
      run: |
        python test_app.py

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Build Docker image
      run: |
        docker build -t lost-found-app:latest .
        docker tag lost-found-app:latest ghcr.io/mohan454522/lost-found-app:latest
        
    - name: Test container
      run: |
        docker run -d --name test-app lost-found-app:latest
        sleep 10
        docker stop test-app
        docker rm test-app
        
    - name: Push to GitHub Container Registry
      run: |
        echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
        docker push ghcr.io/mohan454522/lost-found-app:latest
        
    - name: Display deployment info
      run: |
        echo "✅ Container built and pushed successfully!"
        echo "📦 Image: ghcr.io/mohan454522/lost-found-app:latest"
        echo "🚀 Ready for Azure deployment"